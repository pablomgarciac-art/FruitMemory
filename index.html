<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#ff3c6f;--c2:#ff8c00;--c3:#00c97a;--c4:#4f7cff;--c5:#b94fff;--c6:#ff4ecb;
  --bg:#0e0e14;--surface:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);
}
html,body{min-height:100vh;background:var(--bg);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}

/* ── PORTADA ── */
.cover{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:24px 16px;
}

.mosaic{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:0;opacity:0.18;pointer-events:none;
  transform:rotate(-5deg) scale(1.3);
}
.mosaic span{
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,5vw,64px);
  filter:saturate(1.5);
}

.cover-inner{
  position:relative;z-index:2;text-align:center;max-width:680px;
}

.cover-badge{
  display:inline-block;
  background:rgba(255,60,111,0.18);border:1px solid rgba(255,60,111,0.45);
  border-radius:50px;padding:6px 18px;font-size:12px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:#ff3c6f;margin-bottom:28px;
}

.cover-title{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(52px,11vw,112px);
  line-height:0.92;letter-spacing:-3px;
  background:linear-gradient(135deg,#fff 0%,#ffd0a0 40%,#ff6fa0 70%,#b060ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;
}

.cover-sub{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:clamp(16px,3vw,26px);
  letter-spacing:8px;text-transform:uppercase;
  color:rgba(255,255,255,0.35);margin-bottom:10px;
}

.cover-by{
  font-size:15px;font-weight:600;letter-spacing:2px;
  color:rgba(255,255,255,0.25);margin-bottom:48px;
}
.cover-by span{color:#ff8c00;font-weight:800;}

.cover-fruits{
  display:flex;gap:12px;justify-content:center;margin-bottom:40px;flex-wrap:wrap;
}
.cover-fruit{
  width:64px;height:64px;border-radius:18px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;
  transition:transform 0.3s;animation:floatFruit var(--dur,3s) ease-in-out infinite;
  animation-delay:var(--del,0s);
}
@keyframes floatFruit{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.level-grid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;}

.level-btn{
  flex:1;min-width:130px;max-width:200px;
  padding:20px 16px;border-radius:20px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);
  transition:all 0.25s;text-align:center;
  position:relative;overflow:hidden;
}
.level-btn::before{
  content:'';position:absolute;inset:0;border-radius:20px;opacity:0;transition:opacity 0.25s;
}
.level-btn.easy::before{background:radial-gradient(circle at 50% 0%,rgba(0,201,122,0.25),transparent 70%)}
.level-btn.med::before{background:radial-gradient(circle at 50% 0%,rgba(255,140,0,0.25),transparent 70%)}
.level-btn.hard::before{background:radial-gradient(circle at 50% 0%,rgba(255,60,111,0.25),transparent 70%)}
.level-btn:hover::before{opacity:1}
.level-btn:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.25)}

.lbtn-icon{font-size:36px;margin-bottom:8px;display:block}
.lbtn-name{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;margin-bottom:4px}
.level-btn.easy .lbtn-name{color:#00c97a}
.level-btn.med  .lbtn-name{color:#ff8c00}
.level-btn.hard .lbtn-name{color:#ff3c6f}
.lbtn-info{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.7;font-weight:600;letter-spacing:0.5px}

/* ── GAME ── */
.game-screen{display:none;min-height:100vh;padding:16px;}
.game-screen.active{display:block;}

.hud{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  margin-bottom:14px;max-width:860px;margin-inline:auto;
}
.hud-pill{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;padding:10px 8px;text-align:center;
}
.hud-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:3px}
.hud-val{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;line-height:1}
.hud-val.t{color:#ffd166}.hud-val.t.urg{color:#ff3c6f;animation:blink 0.5s infinite}
.hud-val.m{color:#4f7cff}.hud-val.p{color:#00c97a}.hud-val.ph{color:#b94fff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}

.phase-pips{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pip{width:36px;height:6px;border-radius:6px;background:rgba(255,255,255,0.12);transition:all 0.4s}
.pip.done{background:#00c97a}
.pip.cur{background:#ffd166;box-shadow:0 0 10px #ffd16688}

.board-wrap{display:flex;justify-content:center;margin-bottom:16px}

.board{display:grid;gap:10px}

.card{cursor:pointer;perspective:800px}
.card-inner{
  width:100%;height:100%;
  position:relative;transform-style:preserve-3d;
  transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);
  border-radius:16px;
}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}

.card-back,.card-front{
  position:absolute;inset:0;border-radius:16px;
  backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
}
.card-back{
  background:linear-gradient(135deg,#1a1040 0%,#0d2060 100%);
  border:1.5px solid rgba(255,255,255,0.1);
}
.card-back-inner{
  width:65%;height:65%;border-radius:12px;
  background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:rgba(255,255,255,0.15);
}
.card-front{
  background:linear-gradient(135deg,#fff 0%,#f0f0f0 100%);
  border:2px solid rgba(255,255,255,0.5);
  transform:rotateY(180deg);
  flex-direction:column;gap:4px;
}
.card-emoji{line-height:1;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.2))}
.card-name{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,0.4);display:block}

.card.matched .card-front{
  background:linear-gradient(135deg,#d4fce8,#a8f0c8);
  border-color:#00c97a;
  animation:popMatch 0.5s ease-out;
}
.card.wrong .card-inner{animation:shake 0.4s ease-in-out}
@keyframes popMatch{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-7px)}75%{transform:rotateY(180deg) translateX(7px)}}

.bottom-bar{display:flex;gap:10px;justify-content:center;margin-top:4px}
.btn{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:13px;letter-spacing:1px;text-transform:uppercase;
  padding:10px 22px;border-radius:50px;border:1.5px solid rgba(255,255,255,0.15);
  cursor:pointer;transition:all 0.2s;background:rgba(255,255,255,0.06);color:#fff;
}
.btn:hover{background:rgba(255,255,255,0.14);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#ff3c6f,#ff8c00);border:none;color:#fff}
.btn.primary:hover{filter:brightness(1.15);transform:translateY(-2px)}

/* overlay */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.overlay.show{display:flex}
.overlay-box{
  background:#13131f;border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;padding:36px 32px;max-width:460px;width:100%;text-align:center;
}
.ov-icon{font-size:60px;margin-bottom:12px}
.ov-title{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;margin-bottom:8px}
.ov-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:24px;line-height:1.6}
.ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.ov-stat{background:rgba(255,255,255,0.06);border-radius:14px;padding:14px 8px}
.ov-stat-v{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:2px}
.ov-stat-l{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.35)}
</style>
</head>
<body>

<!-- ═══════════ PORTADA ═══════════ -->
<div class="cover" id="cover">
  <div class="mosaic" id="mosaic"></div>

  <div class="cover-inner">
    <div class="cover-badge">🎮 Juego de Memoria</div>

    <div class="cover-title">Fruit<br>Memory</div>
    <div class="cover-sub">Desafía tu mente</div>
    <div class="cover-by">by <span>Pablo</span></div>

    <div class="cover-fruits">
      <div class="cover-fruit" style="--dur:3.2s;--del:0s">🍓</div>
      <div class="cover-fruit" style="--dur:2.8s;--del:0.3s">🍊</div>
      <div class="cover-fruit" style="--dur:3.5s;--del:0.6s">🍋</div>
      <div class="cover-fruit" style="--dur:2.6s;--del:0.9s">🍇</div>
      <div class="cover-fruit" style="--dur:3.1s;--del:0.2s">🥝</div>
      <div class="cover-fruit" style="--dur:2.9s;--del:0.5s">🍑</div>
      <div class="cover-fruit" style="--dur:3.3s;--del:0.8s">🍒</div>
    </div>

    <div class="level-grid">
      <div class="level-btn easy" onclick="startLevel('easy')">
        <span class="lbtn-icon">🌱</span>
        <div class="lbtn-name">Fácil</div>
        <div class="lbtn-info">4 × 4 · 3 fases<br>60 segundos</div>
      </div>
      <div class="level-btn med" onclick="startLevel('med')">
        <span class="lbtn-icon">🌿</span>
        <div class="lbtn-name">Medio</div>
        <div class="lbtn-info">6 × 6 · 3 fases<br>60 segundos</div>
      </div>
      <div class="level-btn hard" onclick="startLevel('hard')">
        <span class="lbtn-icon">🔥</span>
        <div class="lbtn-name">Difícil</div>
        <div class="lbtn-info">9 × 9 · 3 fases<br>60 segundos</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ JUEGO ═══════════ -->
<div class="game-screen" id="gameScreen">
  <div class="hud" id="hud">
    <div class="hud-pill"><div class="hud-lbl">Fase</div><div class="hud-val ph" id="hPhase">1/3</div></div>
    <div class="hud-pill"><div class="hud-lbl">Tiempo</div><div class="hud-val t" id="hTimer">60</div></div>
    <div class="hud-pill"><div class="hud-lbl">Movimientos</div><div class="hud-val m" id="hMoves">0</div></div>
    <div class="hud-pill"><div class="hud-lbl">Parejas</div><div class="hud-val p" id="hPairs">0/0</div></div>
  </div>
  <div class="phase-pips" id="pips"></div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="bottom-bar">
    <button class="btn" onclick="goHome()">← Inicio</button>
    <button class="btn" onclick="resetPhase()">↺ Reiniciar</button>
  </div>
</div>

<!-- ═══════════ OVERLAY ═══════════ -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="ov-icon" id="ovIcon">🎉</div>
    <div class="ov-title" id="ovTitle">¡Fase completada!</div>
    <div class="ov-sub" id="ovSub"></div>
    <div class="ov-stats" id="ovStats" style="display:none">
      <div class="ov-stat"><div class="ov-stat-v" id="ovMoves" style="color:#4f7cff">—</div><div class="ov-stat-l">Movimientos</div></div>
      <div class="ov-stat"><div class="ov-stat-v" id="ovScore" style="color:#ffd166">—</div><div class="ov-stat-l">Precisión</div></div>
      <div class="ov-stat"><div class="ov-stat-v" id="ovTime" style="color:#00c97a">—</div><div class="ov-stat-l">Tiempo</div></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="goHome()">← Inicio</button>
      <button class="btn primary" id="ovBtn" onclick="overlayAction()">Siguiente ➜</button>
    </div>
  </div>
</div>

<script>
const FRUITS = [
  {e:'🍓',n:'Fresa'},{e:'🍎',n:'Manzana'},{e:'🍊',n:'Naranja'},{e:'🍋',n:'Limón'},
  {e:'🍇',n:'Uvas'},{e:'🍉',n:'Sandía'},{e:'🍑',n:'Melocotón'},{e:'🍒',n:'Cereza'},
  {e:'🥝',n:'Kiwi'},{e:'🍍',n:'Piña'},{e:'🥭',n:'Mango'},{e:'🍌',n:'Plátano'},
  {e:'🍐',n:'Pera'},{e:'🍈',n:'Melón'},{e:'🫐',n:'Arándano'},{e:'🥥',n:'Coco'},
  {e:'🍅',n:'Tomate'},{e:'🥕',n:'Zanahoria'},{e:'🥦',n:'Brócoli'},{e:'🥑',n:'Aguacate'},
  {e:'🌽',n:'Maíz'},{e:'🍄',n:'Seta'},{e:'🫒',n:'Aceituna'},{e:'🥜',n:'Cacahuete'},
  {e:'🌰',n:'Castaña'},{e:'🥝',n:'Kiwi2'},{e:'🍆',n:'Berenjena'},{e:'🫑',n:'Pimiento'},
  {e:'🧅',n:'Cebolla'},{e:'🧄',n:'Ajo'},{e:'🥬',n:'Lechuga'},{e:'🍯',n:'Miel'},
  {e:'🧁',n:'Cupcake'},{e:'🫓',n:'Pan'},{e:'🥐',n:'Croissant'},{e:'🧇',n:'Gofre'},
  {e:'🥗',n:'Ensalada'},{e:'🫙',n:'Tarro'},{e:'🧃',n:'Zumo'},{e:'🍵',n:'Té'},
  {e:'🍭',n:'Chupa'},{e:'🍬',n:'Caramelo'}
];

const LVLS={easy:{g:4},med:{g:6},hard:{g:9}};

let gs={};

function buildMosaic(){
  const m=document.getElementById('mosaic');
  const all='🍓🍎🍊🍋🍇🍉🍑🍒🥝🍍🥭🍌🍐🫐🥥🍅🥕🥦🥑🌽🍄🫒🥜🌰🍆🫑🧅🧄🥬🍯🧁🍵🍭🎉🌈⭐🎊🎯🍀🌺🦋🎨'.split('');
  for(let i=0;i<35;i++){
    const s=document.createElement('span');
    s.textContent=all[i%all.length];
    m.appendChild(s);
  }
}

function goHome(){
  clearInterval(gs.tid);
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('cover').style.display='flex';
}

function startLevel(lvl){
  gs={level:lvl,phase:1,totalMoves:0,totalTime:0,ovAction:'next'};
  document.getElementById('cover').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  loadPhase();
}

function loadPhase(){
  clearInterval(gs.tid);
  document.getElementById('overlay').classList.remove('show');
  const g=LVLS[gs.level].g;
  const total=g*g;
  const pairsN=Math.floor(total/2);
  const offset=(gs.phase-1)*pairsN;
  const pool=FRUITS.slice(offset,offset+pairsN);
  let deck=[...pool,...pool];
  if(total%2!==0) deck.push({e:'⭐',n:'Estrella'});
  deck=shuffle(deck).slice(0,total);

  gs={...gs,g,total,pairsN,deck,flipped:[],matched:[],moves:0,pairs:0,timer:60,lock:false};
  renderHUD();renderPips();renderBoard();startTimer();
}

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function renderPips(){
  const p=document.getElementById('pips');p.innerHTML='';
  for(let i=1;i<=3;i++){
    const d=document.createElement('div');
    d.className='pip'+(i<gs.phase?' done':i===gs.phase?' cur':'');
    p.appendChild(d);
  }
}

function renderHUD(){
  document.getElementById('hPhase').textContent=`${gs.phase}/3`;
  document.getElementById('hMoves').textContent=gs.moves;
  document.getElementById('hPairs').textContent=`${gs.pairs}/${gs.pairsN}`;
  const te=document.getElementById('hTimer');
  te.textContent=gs.timer;
  te.className='hud-val t'+(gs.timer<=10?' urg':'');
}

function renderBoard(){
  const b=document.getElementById('board');
  const avail=Math.min(window.innerWidth-32,860);
  const gap=10;
  const sz=Math.floor((avail-gap*(gs.g-1))/gs.g);
  b.style.gridTemplateColumns=`repeat(${gs.g},${sz}px)`;
  b.style.gap=gap+'px';
  b.innerHTML='';

  const emojiSz=Math.max(18,Math.floor(sz*0.48));
  const nameSz=Math.max(7,Math.floor(sz*0.13));

  gs.deck.forEach((item,i)=>{
    const c=document.createElement('div');
    c.className='card';c.style.width=sz+'px';c.style.height=sz+'px';
    c.dataset.i=i;
    c.innerHTML=`<div class="card-inner">
      <div class="card-back"><div class="card-back-inner">✦</div></div>
      <div class="card-front">
        <span class="card-emoji" style="font-size:${emojiSz}px">${item.e}</span>
        <span class="card-name" style="font-size:${nameSz}px">${item.n}</span>
      </div>
    </div>`;
    c.addEventListener('click',()=>flip(i));
    b.appendChild(c);
  });
}

function startTimer(){
  gs.tid=setInterval(()=>{
    gs.timer--;renderHUD();
    if(gs.timer<=0){clearInterval(gs.tid);showLose();}
  },1000);
}

function flip(i){
  if(gs.lock||gs.deck[i]._fl||gs.deck[i]._mt) return;
  if(gs.flipped.length>=2) return;
  gs.deck[i]._fl=true;
  gs.flipped.push(i);
  card(i).classList.add('flipped');
  if(gs.flipped.length===2){gs.moves++;gs.totalMoves++;renderHUD();checkMatch();}
}

function card(i){return document.querySelector(`.card[data-i="${i}"]`);}

function checkMatch(){
  gs.lock=true;
  const[a,b]=gs.flipped;
  if(gs.deck[a].e===gs.deck[b].e){
    gs.deck[a]._mt=gs.deck[b]._mt=true;
    gs.pairs++;
    card(a).classList.add('matched');card(b).classList.add('matched');
    gs.flipped=[];gs.lock=false;renderHUD();
    if(gs.pairs===gs.pairsN) setTimeout(phaseWin,600);
  } else {
    setTimeout(()=>{
      [a,b].forEach(x=>{
        gs.deck[x]._fl=false;
        const el=card(x);el.classList.remove('flipped');
        el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),400);
      });
      gs.flipped=[];gs.lock=false;
    },900);
  }
}

function phaseWin(){
  clearInterval(gs.tid);
  gs.totalTime+=gs.timer;
  const acc=gs.moves>0?Math.min(100,Math.round((gs.pairsN/gs.moves)*100)):100;
  gs.ovAction=gs.phase<3?'next':'win';
  showOverlay(
    gs.phase<3?'🎉':'🏆',
    gs.phase<3?`¡Fase ${gs.phase} superada!`:'¡Lo has conseguido!',
    gs.phase<3?`Prepárate para la fase ${gs.phase+1}…`:'Has completado las 3 fases. ¡Increíble!',
    gs.moves,acc,gs.timer,
    gs.phase<3?'Siguiente fase ➜':'¡Ver resultados!'
  );
}

function showLose(){
  gs.ovAction='retry';
  const ov=document.getElementById('overlay');
  document.getElementById('ovIcon').textContent='⏰';
  document.getElementById('ovTitle').textContent='¡Tiempo agotado!';
  document.getElementById('ovSub').textContent=`Fase ${gs.phase} — Encontraste ${gs.pairs} de ${gs.pairsN} parejas.`;
  document.getElementById('ovStats').style.display='none';
  document.getElementById('ovBtn').textContent='↺ Reintentar';
  ov.classList.add('show');
}

function showOverlay(icon,title,sub,moves,acc,time,btnTxt){
  document.getElementById('ovIcon').textContent=icon;
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovSub').textContent=sub;
  document.getElementById('ovMoves').textContent=moves;
  document.getElementById('ovScore').textContent=acc+'%';
  document.getElementById('ovTime').textContent=time+'s';
  document.getElementById('ovStats').style.display='grid';
  document.getElementById('ovBtn').textContent=btnTxt;
  document.getElementById('overlay').classList.add('show');
}

function overlayAction(){
  if(gs.ovAction==='next'){gs.phase++;loadPhase();}
  else if(gs.ovAction==='win'){showFinalWin();}
  else{resetPhase();}
}

function showFinalWin(){
  const acc=gs.totalMoves>0?Math.min(100,Math.round((gs.pairsN*3/gs.totalMoves)*100)):100;
  document.getElementById('ovIcon').textContent='👑';
  document.getElementById('ovTitle').textContent='¡Campeón, Pablo!';
  document.getElementById('ovSub').textContent='Has completado los 3 niveles de fases. ¡Eres un crack!';
  document.getElementById('ovMoves').textContent=gs.totalMoves;
  document.getElementById('ovScore').textContent=acc+'%';
  document.getElementById('ovTime').textContent=gs.totalTime+'s';
  document.getElementById('ovStats').style.display='grid';
  document.getElementById('ovBtn').textContent='Jugar de nuevo';
  gs.ovAction='home';
  document.getElementById('overlay').classList.add('show');
}

function resetPhase(){loadPhase();}

buildMosaic();
</script>
